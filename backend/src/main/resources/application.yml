spring:
  application:
    name: quizai

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/quizdb}
    username: ${POSTGRES_USER:quiz}
    password: ${POSTGRES_PASSWORD:quiz123}

  jpa:
    hibernate:
      ddl-auto: validate      # schema do Flyway quản lý, Hibernate chỉ kiểm tra
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD:neo4j123}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    # Gmail SMTP. MAIL_PASSWORD phải là "App Password" 16 ký tự của Google,
    # KHÔNG phải mật khẩu đăng nhập Gmail — Google đã chặn đăng nhập bằng mật khẩu thường từ 2022.
    # Lấy tại: https://myaccount.google.com/apppasswords (cần bật xác minh 2 bước trước)
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # Không để treo vô hạn khi mạng chặn cổng 587
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  servlet:
    multipart:
      max-file-size: 25MB        # upload học liệu cho RAG
      max-request-size: 25MB

server:
  port: 8080

# ===== Cấu hình riêng của ứng dụng =====
app:
  jwt:
    secret: ${JWT_SECRET:}
    access-ttl-seconds: ${JWT_ACCESS_TTL:900}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL:1209600}
  cors:
    # Hiểu là *mẫu* origin (Spring allowedOriginPatterns), không phải danh sách cứng.
    # Mặc định mở cho localhost và các dải IP nội bộ để điện thoại cùng Wi-Fi quét QR vào được.
    # TRIỂN KHAI THẬT: đặt CORS_ALLOWED_ORIGINS thành đúng tên miền, đừng để mặc định này.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*],http://192.168.*.*:[*],http://10.*.*.*:[*],http://172.16.*.*:[*]}
  mail:
    # Tên và địa chỉ hiện ở ô "Người gửi". Bỏ trống from thì dùng chính spring.mail.username.
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:Quiz AI}
    # OTP đặt lại mật khẩu
    otp:
      length: 6
      ttl-minutes: ${OTP_TTL_MINUTES:10}
      # Số lần nhập sai tối đa trước khi huỷ mã — chặn dò 6 chữ số
      max-attempts: ${OTP_MAX_ATTEMPTS:5}
      # Khoảng cách tối thiểu giữa hai lần xin mã, chống spam hòm thư người khác
      resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN:60}

  frontend:
    # Địa chỉ gốc của frontend, dùng để dựng link trong mã QR phòng đấu.
    # Để trống khi dev: backend tự dò địa chỉ LAN để điện thoại quét được.
    # TRIỂN KHAI THẬT: đặt thành đúng tên miền, ví dụ https://quiz.example.com
    base-url: ${FRONTEND_BASE_URL:}
    # Cổng dev server của frontend, chỉ dùng khi base-url để trống
    dev-port: ${FRONTEND_DEV_PORT:5173}
  storage:
    # Thư mục lưu file người dùng tải lên (đã gitignore). Triển khai thật nên trỏ ra volume riêng.
    upload-dir: ${UPLOAD_DIR:uploads}
    # Giới hạn riêng cho ảnh, chặt hơn giới hạn multipart chung ở trên (chung phải rộng cho học liệu RAG)
    max-image-size-bytes: ${MAX_IMAGE_SIZE_BYTES:2097152}   # 2MB
  ai:
    provider-order: ${AI_PROVIDER_ORDER:gemini,grok}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      # gemini-2.5-flash đã bị Google khoá với tài khoản mới (404 NOT_FOUND)
      model: ${GEMINI_MODEL:gemini-3.6-flash}
      # Google đã gỡ text-embedding-004 nên để cấu hình được, đừng hardcode.
      # Kiểm model còn sống: GET https://generativelanguage.googleapis.com/v1beta/models
      embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
      # Phải khớp kiểu cột material_chunks.embedding vector(n) — đổi số này thì cần migration mới
      embedding-dimensions: ${GEMINI_EMBEDDING_DIMENSIONS:768}
    grok:
      api-key: ${GROK_API_KEY:}
      model: ${GROK_MODEL:grok-2}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    mail:
      # TẮT có chủ đích. Spring tự thêm MailHealthIndicator khi có starter-mail, và nó thử kết nối
      # SMTP mỗi lần gọi /actuator/health. Chưa cấu hình mail (hoặc Gmail chặn tạm) là cả ứng dụng
      # bị báo DOWN — trong khi mọi thứ khác vẫn chạy tốt.
      #
      # Health check là thứ load balancer và Docker dùng để quyết định gỡ instance hay khởi động
      # lại container. Gửi email là chức năng phụ, hỏng nó không đáng để cả hệ thống bị coi là chết.
      # Trạng thái gửi mail theo dõi qua log của MailService.
      enabled: false

logging:
  level:
    com.datn.quizai: DEBUG
